name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Create Project
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/localagent
          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          include ':app'
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.0' }
          android {
            compileSdk 34
            namespace 'com.localagent'
            defaultConfig { applicationId "com.localagent"; minSdk 26; targetSdk 34; versionCode 1; versionName "1.0" }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            buildToolsVersion "34.0.0"
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="LocalAgent"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application>
          </manifest>
          EOF
          echo 'package com.localagent; import android.app.Activity; import android.os.Bundle; import android.widget.TextView; public class MainActivity extends Activity{ protected void onCreate(Bundle b){super.onCreate(b); TextView t=new TextView(this); t.setText("FINAL APK WORKS"); setContentView(t);} }' > app/src/main/java/com/localagent/MainActivity.java

      - name: Build
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LocalAgent-APK
          path: app/build/outputs/apk/debug/*.apk
