name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Create App
        run: |
          rm -rf app build.gradle settings.gradle || true
          mkdir -p app/src/main/java/com/localagent
          echo "include ':app'" > settings.gradle
          echo "buildscript{repositories{google();mavenCentral()} dependencies{classpath 'com.android.tools.build:gradle:8.2.0'}} allprojects{repositories{google();mavenCentral()}}" > build.gradle
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { compileSdk 34; namespace 'com.localagent'; defaultConfig { applicationId "com.localagent"; minSdk 26; targetSdk 34 } }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="Local Agent"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          echo 'package com.localagent; import android.app.Activity; import android.os.Bundle; import android.widget.TextView; public class MainActivity extends Activity{ protected void onCreate(Bundle b){super.onCreate(b); TextView t=new TextView(this); t.setText("APK Works!"); setContentView(t);} }' > app/src/main/java/com/localagent/MainActivity.java

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LocalAgent-APK
          path: app/build/outputs/apk/debug/*.apk
